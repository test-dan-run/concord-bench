# A full kit's concord/compose.yml holding both apps (CONTRACTS.md §6). A kit with one app has only that
# service and no peer URL. install.sh writes KIT_DIR and the image tags into concord/.env beside it.
name: ${CONCORD_PROJECT:-concord}
services:
  concord-bench:
    image: ${BENCH_IMAGE:?install.sh writes BENCH_IMAGE into concord/.env}
    hostname: concord-bench
    restart: unless-stopped
    networks: [platform]
    ports: ["127.0.0.1:8600:8600"]
    environment:
      PLATFORM_DIR: ${KIT_DIR}/platform
      AICORE_ENDPOINTS: ${KIT_DIR}/platform/clients/aicore/src/aicore/endpoints.generated.yaml
      UV_OFFLINE: "1"
      LABEL_URL: http://concord-label:8610
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KIT_DIR:?install.sh writes KIT_DIR into concord/.env}/platform:${KIT_DIR}/platform
      - ${KIT_DIR}/assets:${KIT_DIR}/assets:ro
      - bench-data:/data
  concord-label:
    image: ${LABEL_IMAGE:?install.sh writes LABEL_IMAGE into concord/.env}
    hostname: concord-label
    restart: unless-stopped
    networks: [platform]
    ports: ["127.0.0.1:8610:8610"]
    environment:
      PLATFORM_DIR: ${KIT_DIR}/platform
      AICORE_ENDPOINTS: ${KIT_DIR}/platform/clients/aicore/src/aicore/endpoints.generated.yaml
      UV_OFFLINE: "1"
      BENCH_URL: http://concord-bench:8600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KIT_DIR}/platform:${KIT_DIR}/platform
      - ${KIT_DIR}/assets:${KIT_DIR}/assets:ro
      - label-data:/data
networks:
  platform:
    name: ${AI_NETWORK:-ai-net}
    external: true
volumes:
  bench-data: {}
  label-data: {}
