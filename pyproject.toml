[project]
name = "concord"
version = "0.1.0"
description = "Evaluate, label and improve speech models (ASR, VAD / diarisation) served by the personal AI platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "python-multipart>=0.0.20",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "numpy>=2.1",
    "soundfile>=0.13",
    "soxr>=0.5",
    "jiwer>=4.0",
    "pyannote.metrics>=4.0",
    "meeteval>=0.4",
    "whisper-normalizer>=0.1.12",
    "aicore[oip]",
]

[project.optional-dependencies]
# concord-full: Phase 3 (Improve). Training dependencies are added here when Phase 3 is scoped (Q5).
full = []

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "import-linter>=2.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/concord", "backend/concord_improve"]

[tool.uv.sources]
aicore = { path = "../../platform/clients/aicore", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
addopts = "--import-mode=importlib -m 'not live and not perf'"
markers = [
    "live: needs running platform services (run with `just test-live`)",
    "perf: realistic-size performance check (run with `just test-perf`)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "tests", "fixtures/synth"]
extend-exclude = ["backend/concord/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
